services:
  - type: web
    name: allstar-ink
    runtime: node
    plan: free
    buildCommand: npm ci --production=false && npm rebuild better-sqlite3 --build-from-source && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
    healthCheckPath: /
    autoDeploy: false